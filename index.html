<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Cofrinho de Jogos</title>
  <style>
    :root { --bg:#07111f; --card:#101d30; --gold:#ffc857; --green:#35d39a; --red:#ff6b6b; --text:#edf4ff; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; font-family:Inter,Arial,sans-serif; background:radial-gradient(circle at top,#172b46,#07111f 60%); color:var(--text); }
    header { display:flex; justify-content:space-between; align-items:center; padding:18px 28px; border-bottom:1px solid #ffffff12; }
    h1,h2,p { margin-top:0 } main { max-width:1100px; margin:auto; padding:28px 18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px; } .card { background:linear-gradient(145deg,#12233a,var(--card)); border:1px solid #ffffff12; border-radius:18px; padding:20px; box-shadow:0 12px 30px #0004; }
    .big { font-size:32px; font-weight:800; } .gold { color:var(--gold); } .green { color:var(--green); }
    input { width:100%; padding:12px; border:1px solid #ffffff20; border-radius:10px; background:#091526; color:white; margin:8px 0; }
    button { border:0; border-radius:10px; padding:12px 16px; font-weight:800; cursor:pointer; background:var(--gold); color:#1a1300; } button.secondary { background:#263b58; color:white; } button.danger { background:#372131; color:#ff9e9e; }
    .game { text-align:center; } .slots { display:flex; justify-content:center; gap:10px; margin:18px 0; } .slot { width:82px; height:82px; display:grid; place-items:center; border-radius:14px; background:#091526; border:1px solid #ffffff18; font-size:44px; }
    table { width:100%; border-collapse:collapse; font-size:14px; } th,td { text-align:left; padding:10px 6px; border-bottom:1px solid #ffffff10; } .muted { color:#93a4ba; } .actions { display:flex; gap:8px; flex-wrap:wrap; }
  </style>
</head>
<body>
<header><h2>🎰 Meu Cofrinho</h2><span class="muted">Somente demonstração — sem dinheiro real</span></header>
<main>
  <section class="grid">
    <div class="card"><p class="muted">Cofrinho protegido</p><div class="big gold" id="piggy">R$ 0,00</div></div>
    <div class="card"><p class="muted">Saldo fictício para jogar</p><div class="big green" id="playBalance">R$ 0,00</div></div>
  </section>
  <section class="grid" style="margin-top:18px">
    <div class="card">
      <h2>Adicionar ao cofrinho</h2>
      <input id="deposit" type="number" min="1" step="0.01" placeholder="Valor fictício" />
      <div class="actions"><button onclick="deposit()">Depositar</button><button class="secondary" onclick="transferToGame()">Transferir 10% para jogar</button></div>
    </div>
    <div class="card">
      <h2>Resgatar</h2>
      <input id="withdraw" type="number" min="1" step="0.01" placeholder="Valor fictício" />
      <button onclick="withdraw()">Resgatar do cofrinho</button>
    </div>
  </section>
  <section class="card game" style="margin-top:18px">
    <h2>Jogo divertido 🎯</h2><p class="muted">Resultado aleatório. O cofrinho nunca perde.</p>
    <div class="slots"><div class="slot" id="s1">🍒</div><div class="slot" id="s2">🍋</div><div class="slot" id="s3">⭐</div></div>
    <div class="actions" style="justify-content:center"><button onclick="play(1)">Apostar R$ 1</button><button class="secondary" onclick="play(5)">Apostar R$ 5</button></div>
    <p id="result" class="muted"></p>
  </section>
  <section class="card" style="margin-top:18px"><h2>Extrato</h2><div style="overflow:auto"><table><thead><tr><th>Tipo</th><th>Valor</th><th>Saldo</th><th>Data</th></tr></thead><tbody id="history"></tbody></table></div></section>
</main>
<script>
  const symbols=['🍒','🍋','⭐','7️⃣','💎'];
  let state=JSON.parse(localStorage.getItem('cofrinho'))||{piggy:0,play:0,history:[]};
  const money=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  function save(){localStorage.setItem('cofrinho',JSON.stringify(state));render();}
  function add(type,value){state.history.unshift({type,value,balance:state.piggy,date:new Date().toLocaleString('pt-BR')});}
  function render(){document.getElementById('piggy').textContent=money(state.piggy);document.getElementById('playBalance').textContent=money(state.play);document.getElementById('history').innerHTML=state.history.length?state.history.map(x=>`<tr><td>${x.type}</td><td>${money(x.value)}</td><td>${money(x.balance)}</td><td>${x.date}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">Nenhuma movimentação</td></tr>';}
  function deposit(){const v=Number(document.getElementById('deposit').value);if(v<=0)return alert('Informe um valor válido');state.piggy+=v;add('Depósito no cofrinho',v);save();document.getElementById('deposit').value='';}
  function withdraw(){const v=Number(document.getElementById('withdraw').value);if(v<=0||v>state.piggy)return alert('Valor inválido ou maior que o cofrinho');state.piggy-=v;add('Resgate do cofrinho',-v);save();document.getElementById('withdraw').value='';}
  function transferToGame(){const v=Number((state.piggy*.1).toFixed(2));if(v<=0)return alert('Deposite primeiro no cofrinho');state.piggy-=v;state.play+=v;add('Transferência para jogos',-v);save();}
  function play(bet){if(bet>state.play)return alert('Transfira saldo fictício do cofrinho primeiro');state.play-=bet;const a=[];for(let i=0;i<3;i++)a.push(symbols[Math.floor(Math.random()*symbols.length)]);document.getElementById('s1').textContent=a[0];document.getElementById('s2').textContent=a[1];document.getElementById('s3').textContent=a[2];let prize=0;if(a[0]==a[1]&&a[1]==a[2])prize=bet*5;else if(a[0]==a[1]||a[1]==a[2]||a[0]==a[2])prize=bet*2;if(prize){state.play+=prize;document.getElementById('result').innerHTML=`<span class="green">Você ganhou R$ ${prize.toFixed(2)} no jogo fictício!</span>`;}else document.getElementById('result').innerHTML=`<span class="muted">Sem prêmio nesta rodada.</span>`;state.history.unshift({type:'Jogada fictícia',value:prize-bet,balance:state.piggy,date:new Date().toLocaleString('pt-BR')});save();}
  render();
</script>
</body>
</html>
